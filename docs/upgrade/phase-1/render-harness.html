<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #F1F2EC; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const params = new URLSearchParams(location.search);
const view = params.get("view") || "hero";
const W = +(params.get("w") || 1600), H = +(params.get("h") || 1000);

// Phase 1 tokens (docs/upgrade/phase-1-visual-system.md).
const T = {
  paper: "#F1F2EC", ink: "#161B19", pencil: "#57605B",
  green: "#3B6A4B", buff: "#E8E2C9",
  ivoryPlastic: "#E7E0CA", blackPlastic: "#1B1E1C",
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// ---------- Vinyl roll-up tournament mat ----------
const SQ = 1, BORDER = 0.62, MAT = 8 * SQ + 2 * BORDER;
function matTexture(px) {
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  const s = px / MAT, b = BORDER * s;
  g.fillStyle = T.buff; g.fillRect(0, 0, px, px);
  for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
    // a1 dark. Canvas y grows downward: rank 8 at top.
    const dark = (f + r) % 2 === 0;
    if (dark) { g.fillStyle = T.green; g.fillRect(b + f * s, b + (7 - r) * s, s, s); }
  }
  g.strokeStyle = T.green; g.lineWidth = s * 0.028;
  g.strokeRect(b - s * 0.06, b - s * 0.06, 8 * s + s * 0.12, 8 * s + s * 0.12);
  g.fillStyle = T.green;
  g.font = `600 ${Math.round(s * 0.26)}px "Helvetica Neue", Arial, sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle";
  const files = "abcdefgh";
  for (let i = 0; i < 8; i++) {
    const x = b + (i + 0.5) * s;
    g.fillText(files[i], x, px - b / 2);
    g.save(); g.translate(x, b / 2); g.rotate(Math.PI); g.fillText(files[i], 0, 0); g.restore();
    const y = b + (7 - i + 0.5) * s;
    g.fillText(String(i + 1), b / 2, y);
    g.save(); g.translate(px - b / 2, y); g.rotate(Math.PI); g.fillText(String(i + 1), 0, 0); g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function grainTexture(px) {
  // Fine pebble grain of calendered vinyl, used as a bump map.
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  const img = g.createImageData(px, px);
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < px * px; i++) {
    const v = 118 + rnd() * 20;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.filter = "blur(0.6px)"; g.drawImage(c, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 6);
  return t;
}
const matGeo = new THREE.PlaneGeometry(MAT, MAT, 120, 120);
matGeo.rotateX(-Math.PI / 2);
{
  // Roll memory: the two short ends lift a little, the way a rolled mat never quite lies flat.
  const p = matGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i);
    const d = Math.abs(z) - (MAT / 2 - 0.9);
    if (d > 0) p.setY(i, 0.055 * (d / 0.9) ** 2.2);
  }
  matGeo.computeVertexNormals();
}
const mat = new THREE.Mesh(matGeo, new THREE.MeshPhysicalMaterial({
  map: matTexture(4096), bumpMap: grainTexture(1024), bumpScale: 0.35,
  roughness: 0.58, metalness: 0, sheen: 0.15, sheenRoughness: 0.8, sheenColor: new THREE.Color("#ffffff"),
  clearcoat: 0.12, clearcoatRoughness: 0.55,
}));
mat.receiveShadow = true;
scene.add(mat);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: new THREE.Color("#1f2a24"), opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; ground.receiveShadow = true;
scene.add(ground);

// ---------- Tournament plastic Staunton pieces (lathe-turned) ----------
function arc(cx, cy, r, a0, a1, n = 10) {
  const out = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * (i / n); out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return out;
}
function base(r) {
  return [[0, 0], [r, 0], [r, 0.035], [r * 0.97, 0.06], ...arc(r * 0.9, 0.085, 0.035, -Math.PI / 2, Math.PI / 2, 6), [r * 0.78, 0.13], [r * 0.64, 0.165]];
}
const lathe = (pts) => {
  const g = new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(Math.max(x, 0.0001), y)), 64);
  g.deleteAttribute("uv");
  return g;
};
function pawnGeo() {
  return lathe([...base(0.3), [0.18, 0.22], [0.12, 0.42], [0.17, 0.46], [0.18, 0.49], [0.1, 0.52], [0.085, 0.56], ...arc(0, 0.68, 0.135, -Math.PI / 2 + 0.55, Math.PI / 2, 12)]);
}
function rookGeo() {
  const body = lathe([...base(0.33), [0.22, 0.24], [0.17, 0.62], [0.24, 0.66], [0.25, 0.72], [0.23, 0.75], [0.23, 0.9], [0.15, 0.9], [0.15, 0.86], [0, 0.86]]).toNonIndexed();
  const parts = [body];
  for (let i = 0; i < 5; i++) {
    const a0 = (i / 5) * Math.PI * 2, a1 = a0 + (Math.PI * 2 / 5) * 0.6;
    const sh = new THREE.Shape();
    sh.absarc(0, 0, 0.23, a0, a1, false);
    sh.absarc(0, 0, 0.15, a1, a0, true);
    const m = new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2, curveSegments: 10 });
    m.deleteAttribute("uv");
    m.rotateX(-Math.PI / 2); m.translate(0, 0.9, 0);
    parts.push(m.toNonIndexed());
  }
  return mergeGeometries(parts);
}
function bishopGeo() {
  const g = lathe([...base(0.31), [0.18, 0.24], [0.1, 0.64], [0.19, 0.68], [0.2, 0.72], [0.11, 0.75], [0.1, 0.78],
    [0.15, 0.84], [0.175, 0.92], [0.17, 1.0], [0.14, 1.07], [0.09, 1.13], [0.04, 1.17], [0.03, 1.19], ...arc(0, 1.235, 0.048, -Math.PI / 2, Math.PI / 2, 8)]).toNonIndexed();
  return g;
}
// The mitre's cut, a thin dark wedge laid into the head.
const slitGeo = (() => { const g = new THREE.BoxGeometry(0.03, 0.2, 0.4); g.deleteAttribute("uv"); g.rotateZ(-0.6); g.translate(0.035, 1.0, 0); return g; })();
function queenGeo() {
  const g = lathe([...base(0.36), [0.2, 0.26], [0.11, 0.85], [0.21, 0.9], [0.22, 0.95], [0.12, 0.98], [0.11, 1.02], [0.2, 1.22], [0.22, 1.25], [0.14, 1.25], [0.12, 1.3], ...arc(0, 1.36, 0.07, -Math.PI / 2, Math.PI / 2, 8)]);
  const parts = [g.toNonIndexed()];
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const s = new THREE.SphereGeometry(0.035, 12, 8); s.deleteAttribute("uv");
    s.translate(Math.cos(a) * 0.205, 1.27, Math.sin(a) * 0.205);
    parts.push(s.toNonIndexed());
  }
  return mergeGeometries(parts);
}
function kingGeo() {
  const g = lathe([...base(0.37), [0.21, 0.27], [0.12, 0.9], [0.22, 0.95], [0.23, 1.0], [0.13, 1.03], [0.12, 1.07], [0.21, 1.28], [0.21, 1.32], [0.1, 1.36], [0.06, 1.4], [0, 1.4]]);
  const v = new THREE.BoxGeometry(0.06, 0.24, 0.06); v.deleteAttribute("uv"); v.translate(0, 1.51, 0);
  const h = new THREE.BoxGeometry(0.18, 0.06, 0.06); h.deleteAttribute("uv"); h.translate(0, 1.54, 0);
  return mergeGeometries([g.toNonIndexed(), v.toNonIndexed(), h.toNonIndexed()]);
}
function knightGeo() {
  const b = lathe([...base(0.33), [0.21, 0.26], [0.2, 0.33], [0, 0.33]]).toNonIndexed();
  const pts = [[-0.19, 0.3], [-0.235, 0.46], [-0.24, 0.62], [-0.215, 0.78], [-0.16, 0.9], [-0.09, 0.99], [-0.05, 1.05], [-0.045, 1.14], [-0.01, 1.2],
    [0.03, 1.13], [0.07, 1.1], [0.12, 1.07], [0.2, 1.0], [0.27, 0.91], [0.32, 0.82], [0.345, 0.75], [0.33, 0.7], [0.28, 0.67], [0.2, 0.68],
    [0.13, 0.66], [0.08, 0.6], [0.085, 0.5], [0.14, 0.4], [0.18, 0.3]];
  const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const head = new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.05, bevelSegments: 8, curveSegments: 16, steps: 1 });
  head.deleteAttribute("uv");
  head.translate(0, 0, -0.08);
  // Taper toward the muzzle and the crest so the head reads as carved, not cut from sheet.
  const p = head.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    let k = 1;
    if (x > 0.12) k *= 1 - 0.38 * Math.min(1, (x - 0.12) / 0.23);
    if (y > 0.95) k *= 1 - 0.3 * Math.min(1, (y - 0.95) / 0.25);
    if (y < 0.5) k *= 1 + 0.25 * (0.5 - y) / 0.2;
    p.setZ(i, z * k);
  }
  return mergeGeometries([b, head.toNonIndexed()]);
}
const GEOS = { P: pawnGeo(), R: rookGeo(), B: bishopGeo(), Q: queenGeo(), K: kingGeo(), N: knightGeo() };
for (const g of Object.values(GEOS)) g.computeVertexNormals();
const plastic = (hex, r = 0.34) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: r, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.28, specularIntensity: 0.6 });
const MATS = { w: plastic(T.ivoryPlastic, 0.42), b: plastic(T.blackPlastic, 0.32) };
const slitMat = { w: new THREE.MeshStandardMaterial({ color: "#8f8a7a", roughness: 0.6 }), b: new THREE.MeshStandardMaterial({ color: "#050606", roughness: 0.6 }) };
const felt = new THREE.MeshStandardMaterial({ color: T.green, roughness: 1 });

const pos = await (await fetch("./position.json")).json();
const squareXZ = (sq) => [ (sq.charCodeAt(0) - 97 - 3.5) * SQ, -((+sq[1]) - 1 - 3.5) * SQ ];
for (const p of pos.pieces.filter((x) => !x.captured)) {
  const m = new THREE.Mesh(GEOS[p.type], MATS[p.color]);
  const [x, z] = squareXZ(p.square);
  m.position.set(x, 0.012, z);
  // Knights in profile, facing across the board toward each other, turned a little to the viewer.
  if (p.type === "N") m.rotation.y = p.color === "w" ? Math.PI - 0.35 : 0.35;
  if (p.type === "B") { const sl = new THREE.Mesh(slitGeo, slitMat[p.color]); sl.rotation.y = 0.5; m.add(sl); }
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.012, 32), felt);
  f.position.set(x, 0.006, z);
  scene.add(f);
}

// ---------- Light ----------
const key = new THREE.DirectionalLight("#fffaf0", 2.6);
key.position.set(-6, 11, 5);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.left = key.shadow.camera.bottom = -7;
key.shadow.camera.right = key.shadow.camera.top = 7;
key.shadow.radius = 5; key.shadow.blurSamples = 16; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
scene.add(new THREE.HemisphereLight("#ffffff", "#b9c2b6", 0.45));

// ---------- Views ----------
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
const views = {
  // Low, slow orbit at rest, from White's side, current position.
  hero: { fov: 26, pos: [7.2, 9.4, 12.6], target: [0, 0.2, 0.3] },
  // Material detail: b5 bishop against c6 knight, printed coordinates in frame.
  detail: { fov: 16, pos: [-7.5, 3.1, 7.8], target: [-2.1, 0.45, -0.9] },
  // "Your move": low raking angle across the board, White to move.
  raking: { fov: 20, pos: [2.4, 1.55, 14.5], target: [0.3, 0.55, 0.4] },
  // Top-down for the SSR poster comparison.
  top: { fov: 18, pos: [0, 30, 0.001], target: [0, 0, 0] },
};
Object.assign(views, {
  // Option B: full-bleed canvas, board composed into the right of the frame via lens shift (no skew).
  heroB: { fov: 24, pos: [7.4, 10.4, 14.6], target: [0.2, 0.2, 0.4], shift: 1.42 },
  // Option A: board in its own column.
  heroA: { fov: 27, pos: [6.6, 9.8, 12.4], target: [0, 0.1, 0.2] },
  // Phones: tighter, a little lower.
  heroM: { fov: 29, pos: [5.6, 8.6, 12.6], target: [-0.35, 0.2, 0.35] },
  // Contact band: raking, board to the right of the scoresheet.
  rakingB: { fov: 17, pos: [3.4, 1.7, 16.5], target: [0.3, 0.5, 0.3], shift: 1.5 },
  rakingM: { fov: 21, pos: [2.2, 1.9, 14.2], target: [0.2, 0.5, 0.4] },
});
const v = views[view];
cam.fov = v.fov; cam.position.set(...v.pos); cam.lookAt(...v.target);
if (v.shift) cam.setViewOffset(W * v.shift, H, 0, 0, W, H);
cam.updateProjectionMatrix();
renderer.render(scene, cam);
window.__ready = true;
</script>
</body>
</html>
