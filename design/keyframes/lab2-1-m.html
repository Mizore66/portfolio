  <h1 class="ttl display">One search,<br>two evaluators.</h1>
  <p class="note" style="left:20px;right:20px;top:366px"><b>HANDCRAFTED</b>PeSTO piece-square tables, by Ronald Friederich: what a knight is worth on each square.</p>
  <p class="note" style="left:20px;right:20px;bottom:24px"><b>LEARNED</b>A small net I trained: 768 inputs, two 256-wide halves, 32, then one number. The same search runs on both sides.</p>

</div></div>
<script type="module">
import { seam } from "./_shared/seam.js"; import { twin } from "./_shared/twin.js";
import { THREE, renderer, applyEnv, piece, MAT } from "./_shared/chess3d.js"; import { learnedKnight } from "./_shared/sculptures.js";
const D = await (await fetch("./_shared/lab-data.json")).json(); await document.fonts.ready;
const root = document.querySelector(".frame"), W = innerWidth, H = innerHeight, { dark } = seam({ at: .5, dir: "h", root });
const tags = []; const tag = (cam, v, text) => { const p = v.clone().project(cam); tags.push(`<div class="tag" style="left:${(p.x + 1) / 2 * W}px;top:${(1 - p.y) / 2 * H - 18}px">${text}</div>`); };
twin(root, dark, (theme, canvas) => {
  const { r, envTex } = renderer(canvas, { exposure: theme === "day" ? 1 : 1.1 }), scene = new THREE.Scene();
  if (theme === "day") {
    scene.background = new THREE.Color(0xf3f3f1); applyEnv(scene, envTex, .5);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d5ce, .9));

    Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); scene.add(sun);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xeceae5, roughness: .9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const v = D.pestoKnightMg, lo = Math.min(...v), hi = Math.max(...v), hgt = (x) => .14 + (x - lo) / (hi - lo) * 2.4;

    const n = piece("N", MAT.ivory()); n.position.set(1.5, hgt(129), -1.5); n.rotation.y = .5; scene.add(n);
    const cam = new THREE.PerspectiveCamera(30, W / H, .1, 200); cam.position.set(-27, 29.5, 42.5); cam.lookAt(0, .9, 0); cam.setViewOffset(W, H, .02 * W, .178 * H, W, H); cam.updateMatrixWorld();

  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0003; scene.add(key);
  const rim = new THREE.SpotLight(0x9fb4d8, 90, 0, .4, .8, 1.4); rim.position.set(-5, 6, -6); rim.target.position.set(0, 2, 0); scene.add(rim.target, rim);

document.querySelectorAll("#tags").forEach((t) => t.innerHTML = tags.join(""));
