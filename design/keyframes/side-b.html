<style>

  .lab { position: absolute; text-align: left; white-space: nowrap; }

  .lab .r { display: block; margin-top: 3px; font-size: 13px; color: #c9c2b5; } .lab .q { display: block; margin-top: 2px; font-size: 11px; color: #77726a; }

<div class="frame"><canvas id="c"></canvas><div id="ink">
  <nav class="nav"><span>Roles</span><span aria-current="page">Work</span><span>Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <div class="ttl display" id="ttl">Other lines</div><div id="labs"></div>
</div></div>
<script type="module">
import { seam } from "./_shared/seam.js"; import { done } from "./_shared/chess3d.js";
import { simul } from "./_shared/sideboard.js"; import { copy, moveTag } from "./_shared/sideline-copy.js";
await document.fonts.ready;
const S = await copy(), focus = "financial-risk-predictor";
// one long table, the exhibitor's view from its end: the row recedes to the right
const grid = [0, 1, 2, 3, 4, 5, 6].map((i) => [i, 0]);
const g = simul(document.getElementById("c"), { grid, gap: 10.4, cam: { pos: [-10.5, 12, 17], look: [12.5, -1, -1.2], fov: 31 } });
// the labels of boards further down the row wait until the walk along the table reaches them
document.getElementById("labs").innerHTML = S.map((s) => { const a = g.anchors[s.slug].clone(); a.x += 5.3; a.z -= 1.4; const p = g.toScreen(a); if (p.x > innerWidth - 300 || p.y > innerHeight - 100) return "";
  return `<div class="lab${s.slug === focus ? " on" : ""}" style="left:${p.x}px;top:${p.y}px"><span class="mv">${moveTag(s)}</span><b>${s.name}</b><span class="r">${s.result}</span><span class="q">${s.qualifier}</span></div>`; }).join("");
seam({ at: .015, tilt: 0, under: true });
done(g.r, g.scene, g.cam);
</script></body></html>
