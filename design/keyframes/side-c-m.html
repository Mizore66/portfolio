<style>
  body { background: var(--paper); }
  #ink { color: var(--ink); }
  .ttl { position: absolute; left: 18px; top: 72px; font-size: 14vw; color: var(--ink); }
  .sheet { position: absolute; left: 20px; right: 20px; top: 560px; list-style: none; }
  /* the board fades into the gallery black the scoresheet stands on */
  .fade { position: absolute; left: 0; right: 0; top: 522px; bottom: 0; background: linear-gradient(rgb(243 243 241 / 0), var(--paper) 56px); }
  .sheet li { display: grid; grid-template-columns: 58px 1fr; gap: 0 10px; padding: 11px 0; border-top: 1px solid #d9d7d0; }

  .sheet .r { grid-column: 2; margin-top: 2px; font-size: 13px; color: #3a3733; } .sheet .q { grid-column: 2; margin-top: 1px; font-size: 11px; color: #6d6860; }
  .sheet li.on .mv { color: #a86a14; }
  .tag { position: absolute; transform: translateX(-50%); font: 10px var(--font-mono); color: #3a3733; white-space: nowrap; }
  .tag.on { color: #a86a14; }
  .aside { position: absolute; transform: translateX(-50%); font: 10px var(--font-mono); color: #5d5953; white-space: nowrap; text-align: center; }
</style></head><body>
<div class="frame"><canvas id="c"></canvas><div id="ink">
  <nav class="nav"><span>Roles</span><span aria-current="page">Work</span><span>Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <div class="ttl display">Other lines</div><div class="fade"></div><ol class="sheet" id="sheet"></ol><div id="tags"></div>
</div></div>
<script type="module">
import { seam } from "./_shared/seam.js"; import { done } from "./_shared/chess3d.js";
import { analysis as sideBoard, ON_BOARD } from "./_shared/sideboard.js"; import { copy, moveTag } from "./_shared/sideline-copy.js";
await document.fonts.ready;
const S = await copy(), focus = "slm-distillation-engine";
const g = sideBoard(document.getElementById("c"), { focus, cam: { pos: [0, 15.6, 7.4], look: [-.2, 0, -2.1], fov: 50, offset: [0, 50] } });
document.getElementById("sheet").innerHTML = S.map((s) => `<li class="${s.slug === focus ? "on" : ""}"><span class="mv">${s.move ?? "—"}</span><b>${s.name}</b><span class="r">${s.result}</span><span class="q">${s.qualifier}</span></li>`).join("");
document.getElementById("tags").innerHTML = S.map((s) => { const p = g.toScreen(g.anchors[s.slug]); const off = !ON_BOARD.includes(s.slug);
  return `<div class="tag${s.slug === focus ? " on" : ""}" style="left:${p.x + (s.slug === "veridian" ? 30 : 0)}px;top:${p.y + 6}px">${s.move ?? "no move yet"}</div>` + (off ? `<div class="aside" style="left:${p.x}px;top:${p.y + 24}px">${s.move ? "another game" : ""}</div>` : ""); }).join("");
seam({ at: 1, dir: "h" }); // by day: the paper floods
done(g.r, g.scene, g.cam);
