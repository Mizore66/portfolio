<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab A: the seam at the match score</title>
<link rel="stylesheet" href="_shared/tokens.css"><style>
  .num { position:absolute; left:3vw; top:14vh; font-size:14vw; } .pm { position:absolute; left:3.4vw; top:calc(14vh + 13vw); font-size:22px; font-weight:700; } .pm .q { font-size:13px; font-weight:400; color:var(--fg2); margin-top:6px; }
  .body { position:absolute; left:3.4vw; bottom:14vh; font-size:19px; line-height:1.35; max-width:13ch; } .voice { position:absolute; left:3.4vw; bottom:8vh; font-size:16px; font-style:italic; color:var(--fg2); }
  .rec { position:absolute; right:48px; bottom:8vh; font-size:14px; color:var(--move) !important; } .sc { position:absolute; left:calc(30.5% + 14px); bottom:8vh; font-size:13px; color:var(--fg2); }
  svg.t { position:absolute; inset:0; z-index:1; }
</style></head><body><div class="frame">
<svg class="t" id="t"></svg>
<div id="ink"><nav class="nav"><span>Roles</span><span>Work</span><span aria-current="page">Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <h1 class="num display">−143.3</h1><div class="pm">±35.4 Elo<div class="q">Controlled benchmark, 128 games at 50,000 nodes a move</div></div>
  <p class="body">The learned evaluator lost to PeSTO.</p><p class="voice">I published the loss.</p>
  <div class="sc mono">30.5%</div><div class="rec mono">2 wins · 74 draws · 52 losses</div></div></div>
<script type="module">
import { seam } from "./_shared/seam.js"; import { tree } from "./_shared/tree.js";
await document.fonts.ready; seam({ at: .305 }); document.querySelector(".seam-bg").style.background = "var(--search)";
const W = innerWidth, H = innerHeight, x0 = .305 * W, y0 = .66 * H, svg = document.getElementById("t"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const { lines, pv } = tree({ root: [x0, y0], len: .1 * W, depth: 9, seed: 19, bounds: [x0, .34 * H, W - 30, H - 40] });
svg.innerHTML = lines.map(([a, b, c, d, k]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#e9ecf2" stroke-opacity="${Math.min(.1 + .075 * k, .8).toFixed(2)}" stroke-width="${(.35 + .11 * k).toFixed(2)}"/>`).join("")
  + `<polyline points="${pv.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#e8a33d" stroke-width="2.4"/><circle cx="${pv.at(-1)[0]}" cy="${pv.at(-1)[1]}" r="5" fill="#e8a33d"/><circle cx="${x0}" cy="${y0}" r="6" fill="#e9ecf2"/>`;
</script></body></html>
