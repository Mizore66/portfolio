<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab A mobile</title>
<link rel="stylesheet" href="_shared/tokens.css"><style>
  .num { position:absolute; left:14px; top:212px; font-size:24.5vw; } .pm { position:absolute; left:18px; top:312px; font-size:18px; font-weight:700; } .pm .q { font-size:12px; font-weight:400; color:var(--fg2); margin-top:4px; }
  .body { position:absolute; left:18px; bottom:92px; font-size:17px; line-height:1.3; max-width:16ch; } .voice { position:absolute; left:18px; bottom:60px; font-size:14px; font-style:italic; color:var(--fg2); }
  .rec { position:absolute; left:18px; bottom:26px; font-size:12px; color:var(--move) !important; } .sc { position:absolute; right:18px; top:318px; font-size:12px; color:var(--fg2); }
  .lede { position:absolute; left:18px; top:92px; font-size:15px; line-height:1.35; max-width:24ch; }
  svg.t { position:absolute; inset:0; z-index:1; }
</style></head><body><div class="frame">
<svg class="t" id="t"></svg>
<div id="ink"><nav class="nav"><span>Roles</span><span>Work</span><span aria-current="page">Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <p class="lede">I trained a chess evaluator, then made it play the handcrafted one.</p>
  <h1 class="num display">−143.3</h1><div class="pm">±35.4 Elo<div class="q">Controlled benchmark, 128 games</div></div>
  <div class="sc mono">30.5%</div>
  <p class="body">The learned evaluator lost to PeSTO.</p><p class="voice">I published the loss.</p><div class="rec mono">2 wins · 74 draws · 52 losses</div></div></div>
<script type="module">
import { seam } from "./_shared/seam.js"; import { tree } from "./_shared/tree.js";
await document.fonts.ready; seam({ at: .305, dir: "h" }); document.querySelector(".seam-bg").style.background = "var(--search)";
const W = innerWidth, H = innerHeight, x0 = .72 * W, y0 = .305 * H + 92, svg = document.getElementById("t"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const { lines, pv } = tree({ root: [x0, y0], dir: Math.PI / 2 + .12, len: .09 * H, depth: 9, seed: 23, bounds: [150, y0, W - 6, H - 160] });
svg.innerHTML = lines.map(([a, b, c, d, k]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#e9ecf2" stroke-opacity="${Math.min(.1 + .075 * k, .8).toFixed(2)}" stroke-width="${(.3 + .1 * k).toFixed(2)}"/>`).join("")
  + `<polyline points="${pv.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#e8a33d" stroke-width="2"/><circle cx="${pv.at(-1)[0]}" cy="${pv.at(-1)[1]}" r="4" fill="#e8a33d"/><circle cx="${x0}" cy="${y0}" r="5" fill="#e9ecf2"/>`;
</script></body></html>
