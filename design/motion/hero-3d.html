<div class="frame" id="f"><div id="ink">

<script type="module">

// A premium board: rounded maple and walnut tiles with a drawn grain, a walnut frame in eight parts.

const tileGeo = new RoundedBoxGeometry(.985, .16, .985, 3, .035), tiles = {};

  const o = add(new THREE.Mesh(tileGeo, dk ? walnut : maple), "tile", 1); o.mesh.position.set(p.x, -.08, p.z); o.dark = dk; tiles[n] = o; }

[[0, 4.25, 0], [0, -4.25, 0], [4.25, 0, Math.PI / 2], [-4.25, 0, Math.PI / 2]].forEach(([x, z, ry]) => { const o = add(new THREE.Mesh(bar, frameM), "frame", 8.7); o.mesh.position.set(x, -.12, z); o.mesh.rotation.y = ry; });
[[4.25, 4.25], [4.25, -4.25], [-4.25, 4.25], [-4.25, -4.25]].forEach(([x, z]) => { const o = add(new THREE.Mesh(cap, frameM), "frame", .6); o.mesh.position.set(x, -.11, z); });

// The pieces, tracked through the line
const START = "rnbqkbnr/pppppppp/......../......../......../......../PPPPPPPP/RNBQKBNR";
const pieces = []; START.split("/").forEach((row, i) => [...row].forEach((ch, f) => { if (ch === ".") return;
  const w = ch === ch.toUpperCase(), t = ch.toUpperCase(), m = piece(t, w ? MAT.ivory() : MAT.ebony());
  const o = add(m, "piece", t === "P" ? .6 : 1.4); o.type = t; o.white = w; o.sq = "abcdefgh"[f] + (8 - i); m.rotation.y = t === "N" ? (w ? Math.PI / 2 : -Math.PI / 2) : 0; pieces.push(o); }));

// state[k]: where each piece stands after k plies ("x" = taken, set beside the board)
const state = [pieces.map((o) => o.sq)], taken = { w: 0, b: 0 }, side = [];
{ const where = { ...at0 };
  PLIES.forEach((pl) => { const cur = state.at(-1).slice(), mover = where[pl.from];
    if (pl.cap) { const c = where[pl.cap]; const i = pieces.indexOf(c); const s = c.white ? "w" : "b"; cur[i] = `x${s}${taken[s]++}`; delete where[pl.cap]; }
    cur[pieces.indexOf(mover)] = pl.to; delete where[pl.from]; where[pl.to] = mover; state.push(cur); }); }

// ---- timing ----
const T_PLAY = .75, D = PLIES.map((_, i) => .21 * Math.pow(.93, i)), T_AT = []; { let t = T_PLAY; D.forEach((d) => { T_AT.push(t); t += d; }); }
const T_END = T_AT.at(-1) + D.at(-1), T_BLAST = T_END + .28, T_PAPER = T_BLAST + .85, T_NAME = T_PAPER + .4, T_TOTAL = T_NAME + 3.2;
const CHECKS = [15, 17].map((i) => T_AT[i] + D[i]); // 8…Bb4+ and 9…Bxd2+ land

// ---- cameras ----
const cam = new THREE.PerspectiveCamera(mobile ? 46 : 34, W / H, .1, 200);
const C0 = mobile ? [[0, 25, 13], [0, 0, .4]] : [[0, 17, 10.5], [0, 0, .2]];
const C1 = mobile ? [[5.6, 6.8, 9.8], [1.8, .3, 0]] : [[4.6, 4.3, 7.8], [1.5, .3, -.2]];
const C2 = mobile ? [[0, 4, 23], [0, 3.2, 0]] : [[0, 3.4, 20], [0, 3.1, 0]];
const final = new THREE.PerspectiveCamera(cam.fov, W / H, .1, 200); final.position.set(...C2[0]); final.lookAt(...C2[1]); final.updateMatrixWorld();

// ---- where everything floats: layered like the reference, clear of the name ----
// the name is kept clear of near and middle objects; small text (nav, résumé, sentence, eval, sound) is kept clear of everything
const keep = mobile ? [[0, .36, 1, .61]] : [[.02, .12, .97, .68]];
const hard = mobile ? [[0, .84, .72, .99], [0, 0, 1, .07], [.7, .95, 1, 1]] : [[.02, .84, .3, .96], [.54, .84, .76, .99], [0, 0, .3, .09], [.9, 0, 1, .09], [.88, .9, 1, 1]];
const inR = (u, v, m) => ([a, b, c, d]) => u > a - m && u < c + m && v > b - m && v < d + m;
const hits = (u, v, m, dist) => hard.some(inR(u, v, m)) || (dist < 24 && keep.some(inR(u, v, m)));
const placeAt = (u, v, dist) => { const p = new THREE.Vector3(u * 2 - 1, 1 - v * 2, .5).unproject(final), dir = p.sub(final.position).normalize(); return final.position.clone().add(dir.multiplyScalar(dist)); };
const hero = [["K", true, .43, .95, 6.4], ["Q", false, .92, .3, 7.4], ["N", true, .79, .93, 7.4], ["R", false, .46, .02, 10.5], ["B", false, .7, .05, 10]];
const mh = [["K", true, .9, .76, 9], ["Q", false, .3, .29, 12], ["N", true, .84, .3, 11.5], ["R", false, .12, .72, 9.5]];
const used = new Set();
(mobile ? mh : hero).forEach(([t, w, u, v, d]) => { const o = pieces.find((x) => x.type === t && x.white === w && !used.has(x)); used.add(o); o.pf = placeAt(u, v, d); });
for (const o of objs) {
  if (o.pf) continue; let u, v, d, tries = 0;
  do { u = R() * 1.1 - .05; v = R() * 1.1 - .05; d = o.kind === "piece" ? 10 + R() * 12 : o.kind === "frame" && o.size > 1 ? 24 + R() * 14 : 13 + R() * 22; tries++; }
  while (tries < 400 && hits(u, v, Math.min(.12, (o.size / d) * .9), d));
  o.pf = placeAt(u, v, d);
}
objs.forEach((o, i) => { o.axis = new THREE.Vector3(R() - .5, R() - .5, R() - .5).normalize(); o.spin = (o.kind === "piece" ? .6 : 1.4) * (R() * 2 + 1) * (R() < .5 ? -1 : 1);
  o.tilt = new THREE.Quaternion().setFromEuler(new THREE.Euler((R() - .5) * (o.kind === "piece" ? 1 : 2.4), R() * 6.3, (R() - .5) * (o.kind === "piece" ? 1 : 2.4)));
  o.lift = 2 + R() * 3; o.bob = [.05 + R() * .12, .35 + R() * .45, R() * 6.3]; });

const g4 = new THREE.Vector3(sq("g4").x, 0, sq("g4").z), UP = new THREE.Vector3(0, 1, 0), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3();
const lerp3 = (a, b, u) => a.map((x, i) => x + (b[i] - x) * u), ease = gsap.parseEase("seam"), arrive = gsap.parseEase("arrive");
const arc = (u) => Math.sin(Math.PI * u) * .6;
let lastHl = null;

  let k = -1, f = 0; for (let i = 0; i < PLIES.length; i++) if (t >= T_AT[i]) { k = i; f = Math.min(1, (t - T_AT[i]) / (D[i] * .85)); }
  const base = state[Math.max(0, k)], after = k >= 0 ? state[k + 1] : state[0];
  const hl = k >= 0 && f >= 1 ? [PLIES[k].from, PLIES[k].to] : k > 0 ? [PLIES[k - 1].from, PLIES[k - 1].to] : [];
  if (String(hl) !== lastHl) { lastHl = String(hl); for (const n in tiles) tiles[n].mesh.material = hl.includes(n) ? (tiles[n].dark ? hlDark : hlLight) : (tiles[n].dark ? walnut : maple); }
  pieces.forEach((o, i) => { const a = home(base[i]), b = home(after[i]); o.p0.copy(a);
    if (a.distanceTo(b) > .01) { const e = ease(f), taken = after[i][0] === "x"; o.p0.lerpVectors(a, b, e); o.p0.y = taken ? arc(f) * 2 : arc(f) * (o.type === "N" ? 1.3 : 1); } o.q0.setFromEuler(new THREE.Euler(0, o.type === "N" ? (o.white ? Math.PI / 2 : -Math.PI / 2) : 0, 0)); });
  if (!objs[0].q0set) objs.forEach((o) => { if (o.kind !== "piece") { o.p0.copy(o.mesh.position); o.q0.copy(o.mesh.quaternion); o.q0set = true; } });
  // blast from g4: a shockwave, then everything slows into a hover
  for (const o of objs) {
    const tau = t - T_BLAST - o.p0.distanceTo(g4) * .028;
    if (tau <= 0) { o.mesh.position.copy(o.p0); o.mesh.quaternion.copy(o.q0); continue; }
    const u = 1 - Math.exp(-3.1 * tau), bob = Math.sin(t * o.bob[1] + o.bob[2]) * o.bob[0] * Math.min(1, tau);

    tmpQ.setFromAxisAngle(o.axis, o.spin * (u * 2.2 + tau * .05)); o.mesh.quaternion.copy(o.q0).slerp(o.tilt, u).multiply(tmpQ);
  }
  // camera: high and wide, pushing in as the game tightens; a jolt on each check; blown back, then settling on the field
  const push = ease(Math.min(1, Math.max(0, (t - T_PLAY) / (T_END - T_PLAY)))), settle = arrive(Math.min(1, Math.max(0, (t - T_BLAST - .05) / 1.9)));
  let [pos, look] = [lerp3(C0[0], C1[0], push), lerp3(C0[1], C1[1], push)];
  pos = lerp3(pos, C2[0], settle); look = lerp3(look, C2[1], settle);

  const lit = arrive(Math.min(1, t / .7)), blast = Math.max(0, t - T_BLAST), after2 = Math.min(1, blast / 1.2);
  spot.intensity = 140 * lit * (1 - after2 * .7); spot.angle = .5 - .16 * push; spot.penumbra = .55;

  .to(st, { at: AT, duration: .9, ease: "seam", onUpdate: draw }, T_PAPER)
  .to(".ch", { yPercent: 0, duration: .7, ease: "arrive", stagger: per(.028) }, T_NAME)
  .to(".skip", { opacity: 0, duration: .25 }, T_NAME)
  .to(".line i", { yPercent: 0, duration: .6, ease: "arrive", stagger: per(.08) }, T_NAME + .45)
  .to(".ev", { opacity: 1, duration: .4 }, T_NAME + .6)
  .to(".nav span, .sound", { opacity: 1, duration: .4, ease: "arrive", stagger: per(.05) }, T_NAME + .7);
PLIES.forEach((_, i) => tl.call(() => sfx("place", { gain: .55 + .45 * i / PLIES.length, rate: .95 + (i % 3) * .04 }), null, T_AT[i] + D[i] * .85));
tl.call(() => sfx("break"), null, T_BLAST).call(() => sfx("seam", { gain: .8 }), null, T_PAPER);
window.__timing = { T_BLAST, T_PAPER, T_NAME, T_TOTAL };
run(tl, { render: draw }); soundToggle(() => tl.restart());
</script></body></html>
