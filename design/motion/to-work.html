<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion 2: hero to Work, the tilted sweep</title>
<link rel="stylesheet" href="/design/keyframes/_shared/tokens.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
  body { background: var(--gallery); } canvas { z-index: 0; }
  .name { position: absolute; left: 4.2vw; top: 17vh; font-size: 21.5vw; } .ln { display: block; overflow: hidden; padding-bottom: .16em; margin-bottom: -.16em; } .l2 { font-size: .705em; margin-top: .06em; } .ln i { display: block; font-style: normal; }
  .line { position: absolute; left: 4.4vw; bottom: 6.5vh; font-size: 20px; font-weight: 500; line-height: 1.3; } .line span { display: block; overflow: hidden; } .line i { display: block; font-style: normal; }
  .ev { position: absolute; left: calc(55.9% + 20px); bottom: 6.8vh; font-size: 14px; }
  .ttlw { position: absolute; left: 60px; bottom: 5vh; font-size: 12vw; overflow: hidden; padding-bottom: .1em; } .ttlw i { display: block; font-style: normal; }
  .label { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .label b { display: block; font-size: 16px; font-weight: 600; color: #8c877e; } .label.on b { color: #ece6da; font-size: 19px; }
  .label .n { margin-top: 8px; font-size: 14px; color: #c9c2b5; line-height: 1.35; } .label .q { margin-top: 6px; font-size: 12px; color: #77726a; }
  .dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #e8a33d; z-index: 9; pointer-events: none; }
  #ink .nav span, #ink-inv .nav span { transition: none; }
</style></head><body>
<div class="frame" id="f"><canvas id="c"></canvas><div id="ink">
  <nav class="nav"><span>Roles</span><span id="nw">Work</span><span>Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <h1 class="name display"><span class="ln"><i>Anas</i></span><span class="ln l2"><i>Qumhiyeh</i></span></h1>
  <p class="line"><span><i>I like systems that have to</i></span><span><i>survive measurement.</i></span></p><div class="ev mono">10…Bg4 +0.64</div>
  <div class="label" data-k="teleportal"><b>Gemini Teleportal</b></div><div class="label" data-k="circuitmind"><b>CircuitMindAI</b></div>
  <div class="label on" data-k="faultline"><b>FaultLine</b><div class="n">First PASS→FAIL commit<br>in 1-5 min</div><div class="q">Controlled evaluation</div><div class="q mono">g4, where 10…Bg4 landed</div></div>
  <div class="ttlw display"><i>Work</i></div>
</div><div class="dot" id="dot"></div></div>
<script type="module">
import { gsap, liveSeam, run, share } from "./_kit.js"; import { gallery } from "/design/keyframes/_shared/gallery.js"; import { THREE } from "/design/keyframes/_shared/chess3d.js";
await document.fonts.ready;
const root = document.getElementById("f"), W = innerWidth, H = innerHeight;
const g = gallery(document.getElementById("c"), { layout: "plan", light: 1 });
const lights = []; g.scene.traverse((o) => { if (o.isLight) lights.push({ o, base: o.intensity, focus: o.isSpotLight && o.target.position.distanceTo(new THREE.Vector3(...[g.anchors.faultline.x, 0, g.anchors.faultline.z])) < 3 }); });
const envBase = g.scene.environmentIntensity, camEnd = g.cam.position.clone(), look = new THREE.Vector3(-.4, 0, -.2);
document.querySelectorAll("#ink .label").forEach((el) => { const p = g.toScreen(g.anchors[el.dataset.k]); el.style.left = p.x + "px"; el.style.top = p.y + 14 + "px"; });
const S = liveSeam(root, { under: true }); // the dark side is a window onto the gallery
document.querySelectorAll("#ink-inv .label").forEach((el, i) => { const s = document.querySelectorAll("#ink .label")[i]; el.style.left = s.style.left; el.style.top = s.style.top; });
const st = { p: 0, room: 0, focus: 0, cam: 0, dx: W * .6, dy: H * .5 }, dot = document.getElementById("dot");
gsap.set(".label", { opacity: 0, y: 8 }); gsap.set(".ttlw i", { yPercent: 130 });
function render() {
  const at = share(64) + (.015 - share(64)) * st.p, tilt = -13 * Math.sin(Math.PI * st.p);
  S.set(at, tilt);
  for (const l of lights) l.o.intensity = l.base * (l.focus ? Math.max(st.room * .42, st.focus) : st.room);
  g.scene.environmentIntensity = envBase * (.15 + .85 * st.room);
  g.cam.position.copy(camEnd).add(new THREE.Vector3(0, 3.2, 3.6).multiplyScalar(1 - st.cam)); g.cam.lookAt(look);
  g.r.render(g.scene, g.cam); dot.style.left = st.dx + "px"; dot.style.top = st.dy + "px";
}
const nav = document.querySelectorAll(".nav span:nth-child(2)"), nw = document.getElementById("nw").getBoundingClientRect();
const tl = gsap.timeline({ paused: true });
tl.to(st, { dx: nw.left + nw.width / 2, dy: nw.bottom + 10, duration: .55, ease: "seam", onUpdate: render }, 0)
  .to(dot, { scale: .5, duration: .08, yoyo: true, repeat: 1 }, .55)
  .call(() => nav.forEach((n) => n.setAttribute("aria-current", "page")), null, .6)
  .to(st, { p: 1, duration: 1.15, ease: "seam", onUpdate: render }, .62)
  .to(st, { room: 1, duration: 1.1, ease: "arrive", onUpdate: render }, 1.05)
  .to(st, { focus: 1, duration: .55, ease: "arrive", onUpdate: render }, 1.25)
  .to(st, { cam: 1, duration: 1.8, ease: "arrive", onUpdate: render }, .62)
  .to(".name i, .line i", { yPercent: -135, duration: .5, ease: "seam", stagger: .05 }, 1.35)
  .to(".ev", { opacity: 0, duration: .25 }, 1.2)
  .to(".ttlw i", { yPercent: 0, duration: .7, ease: "arrive" }, 1.75)
  .to(".label", { opacity: 1, y: 0, duration: .5, ease: "arrive", stagger: .08 }, 2.05)
  .to(dot, { opacity: 0, duration: .2 }, 2.2).to({}, { duration: .8 });
run(tl, { render });
</script></body></html>
