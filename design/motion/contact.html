<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion 5: arriving at contact</title>
<link rel="stylesheet" href="/design/keyframes/_shared/tokens.css"><style>
  .mv { position:absolute; left:15vw; top:8vh; font-size:30vw; letter-spacing:-.06em; overflow:hidden; padding-bottom:.08em; } .mv i, .m i { display:block; font-style:normal; }
  .caret { position:absolute; left:calc(15vw + 49vw); top:calc(8vh + 5vw); width:.9vw; height:21vw; background:var(--fg); }
  .m { position:absolute; left:4vw; overflow:hidden; } .yours { bottom:18vh; font-size:40px; padding-bottom:.1em; } .mail { bottom:12vh; font-size:20px; font-weight:600; } .rt { bottom:8vh; font-size:13px; color:var(--fg2); }
  .mail u { text-decoration:none; background:linear-gradient(currentColor,currentColor) 0 100%/var(--u,0%) 2px no-repeat; padding-bottom:2px; }
  .links { position:absolute; left:calc(55.9% + 13vw); bottom:10vh; list-style:none; font-size:20px; font-weight:500; line-height:1.7; } .links li { overflow:hidden; } .links li i { display:block; font-style:normal; }
  .clock { position:absolute; left:calc(55.9% - 150px); bottom:8vh; width:300px; display:flex; gap:10px; padding:10px; border-radius:10px; background:#2a2826; z-index:3; transform-origin:50% 100%; }
  .face { flex:1; background:#f3f3f1; color:#0d0d0c; border-radius:5px; padding:8px 10px; position:relative; } .face small { display:block; font-size:11px; color:#77726a; } .face b { font-size:26px; font-weight:500; }
  .face .flag { position:absolute; right:8px; top:9px; width:6px; height:6px; border-radius:50%; background:#e8a33d; } .face sup { font-size:12px; color:#77726a; margin-left:3px; vertical-align:top; position:relative; top:4px; }
  .dot { position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:#e8a33d; z-index:9; opacity:0; }
  @media (max-width: 600px) {
    .mv { left: 16px; top: 80px; font-size: 42vw; } .caret { left: calc(16px + 68.6vw); top: calc(80px + 7vw); width: 5px; height: 29.4vw; }
    .m { left: 20px; } .yours { top: 300px; bottom: auto; font-size: 34px; } .mail { top: 352px; bottom: auto; font-size: 17px; } .rt { top: 382px; bottom: auto; font-size: 12px; }
    .links { left: 20px; top: 620px; bottom: auto; font-size: 17px; }
    .clock { left: 20px; top: 520px; bottom: auto; width: 260px; } .face b { font-size: 22px; }
  }
</style><script>if (location.protocol === "file:") addEventListener("DOMContentLoaded", () => { document.body.innerHTML = '<div style="font:16px/1.5 system-ui;padding:48px;max-width:60ch">This prototype needs the local server, because browsers block its modules on file:// pages. From the portfolio folder run <code>python3 design/serve.py</code>, then open <a href="http://127.0.0.1:4173/design/motion/index.html">http://127.0.0.1:4173/design/motion/index.html</a>.</div>'; });</script></head><body><div class="frame" id="f"><div id="ink"><nav class="nav"><span>Roles</span><span>Work</span><span>Lab</span><span aria-current="page">Contact</span></nav><div class="resume">Résumé</div>
  <div class="mv display"><i>11.</i></div><div class="caret"></div>
  <div class="m yours display"><i>Your move.</i></div><div class="m mail"><i><u>anasqumhiyeh@gmail.com</u></i></div><div class="m rt"><i>Usually replies within two business days (MYT).</i></div>
  <ul class="links"><li><i>Email</i></li><li><i>LinkedIn</i></li><li><i>GitHub</i></li><li><i>Résumé</i></li></ul></div>
  <div class="clock" id="clock"><div class="face"><small>You</small><b class="mono" id="you">14:32</b><sup class="mono" id="sec">05</sup><i class="flag"></i></div><div class="face"><small>Anas, MYT</small><b class="mono">22:32</b></div></div><div class="dot" id="dot"></div></div>
<script type="module">
import { gsap, liveSeam, run, share, reduced, per, mobile, sfx, soundToggle } from "./_kit.js";
await document.fonts.ready;
const root = document.getElementById("f"), S = liveSeam(root, { dir: mobile ? "h" : "v" }), st = { at: .305, tilt: 0, sec: 5, dx: 0, dy: 0, caret: 0 };
const W = innerWidth, mail = document.querySelector("#ink .mail").getBoundingClientRect(), dot = document.getElementById("dot");
function render() { S.set(st.at, st.tilt); const s = Math.floor(st.sec) % 60; document.getElementById("sec").textContent = String(s).padStart(2, "0");
  document.querySelectorAll(".caret").forEach((c) => c.style.opacity = st.caret && (reduced || (st.sec % 1) < .5) ? 1 : 0); dot.style.left = st.dx + "px"; dot.style.top = st.dy + "px"; if (reduced) dot.style.display = "none"; }
gsap.set(".mv i, .m i, .links i", { yPercent: 110 }); gsap.set(".caret", { opacity: 0 }); gsap.set("#clock", { y: 60, rotation: 5, opacity: 0 });
const tl = gsap.timeline({ paused: true });
// from the Lab (30.5%) back to the game's position after 10…Bg4 (+0.64), arriving at an angle and straightening
tl.to(st, { at: share(64), duration: 1.0, ease: "seam", onUpdate: render }, 0)
  .to(st, { tilt: mobile ? 5 : 7, duration: .5, ease: "sine.out", onUpdate: render }, 0).to(st, { tilt: 0, duration: .75, ease: "arrive", onUpdate: render }, .5)
  .to(".mv i", { yPercent: 0, duration: .75, ease: "arrive" }, .55)
  .to(".m i", { yPercent: 0, duration: .6, ease: "arrive", stagger: per(.07) }, .95)
  .to(".links i", { yPercent: 0, duration: .5, ease: "arrive", stagger: per(.05) }, 1.05)
  .to("#clock", { y: 0, rotation: 0, opacity: 1, duration: .8, ease: "arrive" }, 1.1)
  .to(st, { caret: 1, duration: .01, onUpdate: render }, 1.3)
  .fromTo(st, { sec: 5 }, { sec: 12.99, duration: 8, ease: "none", onUpdate: render }, 1.3)
  // the pointer finds the address: the underline draws, as a move being written
  .set(st, { dx: W * .5, dy: innerHeight * .5 }, 4).to(dot, { opacity: 1, duration: .15 }, 4)
  .to(st, { dx: mail.left + 60, dy: mail.top + mail.height / 2, duration: .7, ease: "seam", onUpdate: render }, 4)
  .to(".mail u", { "--u": "100%", duration: .35, ease: "arrive" }, 4.7).to({}, { duration: 1.2 });
tl.call(() => sfx("seam", { gain: .7 }), null, 0); for (let k = 0; k < 8; k++) tl.call(() => sfx("tick", { gain: k % 2 ? .8 : 1 }), null, 1.3 + k);
run(tl, { render }); soundToggle(() => tl.restart());
</script></body></html>
