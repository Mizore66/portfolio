<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion 3: the role page, scroll replays the game</title>
<link rel="stylesheet" href="/design/keyframes/_shared/tokens.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
  body { background: var(--hall-wall); } .edge { position:absolute; top:0; right:0; bottom:0; width:22px; background:var(--ink); z-index:4; } .resume { right:64px; z-index:6; }
  .role { position:absolute; left:52px; top:13vh; z-index:3; } .role h1 { font-size:6.6vw; } .role p { margin-top:10px; font-size:15px; color:var(--pencil); }
  .scrub { position:absolute; left:52px; bottom:6vh; z-index:3; } .scrub .mv { font-size:14px; } .ticks { display:flex; gap:5px; margin:10px 0 8px; align-items:flex-end; }
  .ticks i { display:block; width:1px; height:9px; background:#aaa59c; } .ticks i.p { background:var(--ink); } .ticks i.c { width:2px; height:16px; background:var(--ink); }
  .scrub .g { font-size:12px; color:var(--graphite); }
  .facts { position:absolute; left:52px; top:calc(13vh + 6.6vw + 70px); width:330px; z-index:3; } .fact { position:absolute; left:0; top:0; width:330px; }
  .fact hr { border:0; height:2px; background:var(--ink); margin-bottom:22px; width:260px; transform-origin:left; } .fact p { font-size:17px; line-height:1.45; } .fact b { display:block; margin-top:22px; font-size:24px; font-weight:700; letter-spacing:-.015em; } .fact .q { margin-top:6px; }

</style></head><body>
<div class="frame"><canvas id="c"></canvas><div class="edge"></div>
  <nav class="nav"><span aria-current="page">Roles</span><span>Work</span><span>Lab</span><span>Contact</span></nav><div class="resume">Résumé</div>
  <div class="role"><h1 class="display">Deriv</h1><p>AI Engineer, Jun 2026 to now</p></div><div class="count"></div>
  <div class="facts" id="facts"></div>
  <div class="scrub"><div class="mv mono" id="mv"></div><div class="ticks" id="ticks"></div><div class="g mono" id="gt"></div></div>
</div><div class="bar"><i id="bar"></i></div>
<script type="module">
import { gsap, run } from "./_kit.js"; import { THREE, renderer, applyEnv, board, position, sq } from "/design/keyframes/_shared/chess3d.js";
const G = (await (await fetch("./_games.json")).json())["Tal-Larsen"], C = await (await fetch("/content/content.json")).json();
const role = C.roles.find((r) => r.employer === "Deriv"), claims = Object.fromEntries(C.claims.map((c) => [c.id, c]));
const FACTS = [["derivCxCost", 0], ["derivCsat", null], ["derivEvents", 2], ["derivTimeToFix", 3]].map(([id, b]) => ({ text: b === null ? claims[id].context : role.bullets[b], big: claims[id].display, q: claims[id].qualifier }));
document.getElementById("facts").innerHTML = FACTS.map((f) => `<div class="fact"><hr><p>${f.text}</p><b>${f.big}</b><div class="q qual">${f.q}</div></div>`).join("");
document.getElementById("gt").textContent = "Tal vs Larsen, Bled 1965";
const moves = Math.ceil(G.plies.length / 2); document.getElementById("ticks").innerHTML = "<i></i>".repeat(moves);
await document.fonts.ready;
const W = innerWidth, H = innerHeight, { r, envTex } = renderer(document.getElementById("c"), { exposure: 1.02 });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf2f2ef); applyEnv(scene, envTex, .5);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d6cf, 1.05));
const sun = new THREE.DirectionalLight(0xfffaf0, 2.3); sun.position.set(-7, 12, -5); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 7; sun.shadow.bias = -.0004;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); scene.add(sun);
let brd = null, grp = null, shown = -1;
const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 30), new THREE.MeshStandardMaterial({ color: 0xf3f3f0, roughness: 1 })); wall.position.set(0, 8, -24); scene.add(wall);
for (let i = -4; i <= 4; i++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(3, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); w.position.set(i * 7, 11, -23.9); scene.add(w); }
const cam = new THREE.PerspectiveCamera(38, W / H, .1, 200), look = new THREE.Vector3(.9, .2, -.8), R0 = Math.hypot(-8.4 - .9, 8.6 + .8), A0 = Math.atan2(8.6 + .8, -8.4 - .9);
const END = 30, STEP = .3, st = { ply: 0, f: 0, orbit: 0, fact: -1, scroll: 0 };
const arc = (t) => Math.sin(Math.PI * t) * .55; // lift and set down
function setPly(k) { // the position before ply k, with ply k's squares lit
  if (k === shown) return; shown = k;
  if (grp) scene.remove(grp); if (brd) scene.remove(brd);
  const pl = G.plies[Math.min(k, G.plies.length - 1)];
  brd = board({ highlight: k > 0 ? [G.plies[k - 1].from, G.plies[k - 1].to] : [], tableSize: 16, table: 0xdcd4c6 }); scene.add(brd);
  grp = position(k <= END ? pl.before : G.plies[END].after); scene.add(grp);
}
function render() {
  const k = st.ply; setPly(k);
  if (k <= END) {
    const pl = G.plies[k], f = st.f, e = gsap.parseEase("seam")(f);
    grp.children.forEach((m) => {
      const s = m.userData.square;
      if (s === pl.from) { const a = sq(pl.from), b = sq(pl.to); m.position.set(a.x + (b.x - a.x) * e, arc(f), a.z + (b.z - a.z) * e); }
      else if (pl.rook && s === pl.rook[0]) { const a = sq(pl.rook[0]), b = sq(pl.rook[1]); const g = gsap.parseEase("seam")(Math.max(0, f * 1.4 - .4)); m.position.set(a.x + (b.x - a.x) * g, arc(Math.max(0, f * 1.4 - .4)) * .8, a.z + (b.z - a.z) * g); }
      else if (s === pl.cap) { const t = Math.min(1, Math.max(0, (f - .45) / .4)); m.position.y = t * 1.6; m.scale.setScalar(1 - t); m.visible = t < 1; }
    });
  }
  const a = A0 + st.orbit * .16; cam.position.set(look.x + Math.cos(a) * R0, 3.4 - st.orbit * .5, look.z + Math.sin(a) * R0); cam.lookAt(look); cam.setViewOffset(W, H, -.25 * W, 0, W, H);
  r.render(scene, cam);
  const done = k + (st.f >= 1 ? 1 : 0), cur = Math.max(1, Math.ceil(done / 2)), last = G.plies[Math.max(0, done - 1)];
  document.getElementById("mv").textContent = done ? `${Math.ceil(done / 2)}${done % 2 ? ". " : "… "}${last.san}` : "Start";
  document.querySelectorAll("#ticks i").forEach((t, i) => t.className = i + 1 < cur ? "p" : i + 1 === cur && done ? "c" : "");
  document.querySelector(".count").textContent = st.fact >= 0 ? `${st.fact + 1} / ${FACTS.length}` : "";
  document.getElementById("bar").style.height = st.scroll * 100 + "%";
}
const facts = document.querySelectorAll(".fact"); gsap.set(facts, { opacity: 0, x: -28 }); gsap.set(".fact hr", { scaleX: 0 });
const tl = gsap.timeline({ paused: true });
// A steady scroll from the top of the page to 16. Nd5. Each move plays at hand speed when its scroll threshold is crossed.
for (let k = 0; k <= END; k++) tl.to(st, { f: 1, duration: STEP * .92, ease: "none", onStart: () => { st.ply = k; st.f = 0; }, onUpdate: render, onReverseComplete: () => { st.ply = Math.max(0, k - 1); st.f = 1; } }, .4 + k * STEP);
const T = .4 + (END + 1) * STEP;
tl.to(st, { orbit: 1, scroll: 1, duration: T + .4, ease: "none", onUpdate: render }, 0);
FACTS.forEach((_, i) => { const t = .3 + i * (T - .6) / FACTS.length;
  if (i) tl.to(facts[i - 1], { opacity: 0, x: 18, duration: .28, ease: "seam" }, t - .34);
  tl.call(() => { st.fact = i; }, null, t).to(facts[i], { opacity: 1, x: 0, duration: .55, ease: "arrive" }, t).to(facts[i].querySelector("hr"), { scaleX: 1, duration: .5, ease: "arrive" }, t); });
tl.to({}, { duration: .8 });
run(tl, { render });
</script></body></html>
